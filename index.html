<!DOCTYPE html>
<!--
  Elpriskoll
  Version: 1.6.0
  Senast ändrad: 2026-09-22

  Ändringslogg (senaste överst):
  - 1.6.0 (2026-09-22): "Just nu"-rutan i Tibber-läget använder åter Tibbers
    EGET "current"-fält (inte ett lokalt uträknat värde) som förstahandsval,
    så priset garanterat matchar Tibber-appen exakt. Tidsupplösningen (tim
    eller kvart) följer i så fall vad Tibber faktiskt levererar för det
    aktuella hemmet/grid-bolaget – appen kan inte visa finare upplösning än
    vad Tibber själva har tillgång till där. Elområdesläget (utan inloggning)
    är opåverkat och räknar fortfarande fram aktuell period lokalt, eftersom
    elprisetjustnu.se inte har något motsvarande "current"-fält. "Just nu"-
    rutan visar nu även periodens sluttid (t.ex. "14:00–14:15" eller
    "14:00–15:00"), så tidsupplösningen syns tydligt istället för bara "– nu".
  - 1.5.0 (2026-09-22): Sidan ber nu webbläsaren att aldrig cacha index.html
    (no-cache-metataggar), så uppdateringar syns direkt utan manuell
    cacherensning. Ny "Nollställ allt"-knapp i inställningarna som rensar all
    sparad data och startar om appen helt. Inställningar sparas nu direkt när
    du ändrar dem (ingen separat "Spara"-knapp längre att glömma). Välkomst-
    ruta på startsidan som visar vägen till inställningarna första gången.
    "Koppla från" syns nu även direkt på startsidan, inte bara i
    inställningarna. "Just nu"-rutan räknas nu fram på samma sätt oavsett
    Tibber- eller elområdesläge, så den följer samma tidsupplösning som
    resten av prisöversikten i båda lägena.
  - 1.4.0 (2026-09-22): Token-länken på Tibber-fliken går nu direkt till
    Tibbers inloggning/access-token-sida (developer.tibber.com/settings/
    accesstoken) istället för startsidan. Prisgrafen visar nu prissiffran
    ovanför varje stapel, inte bara höjd/färg. "Idag" i prisöversikten visar
    numera bara innevarande och kommande perioder (inte redan passerade
    timmar sedan midnatt).
  - 1.3.0 (2026-09-22): Prisnivåer i elområdesläget räknas nu upp med svensk
    energiskatt (36,0 öre/kWh) OCH moms (25%), inte bara moms. Länk till
    developer.tibber.com för att hämta Tibber-token. Klockslag i prisgrafen
    (var 4:e stapel vid 15 min-upplösning) + upplösningsbadge. Postnummerfält
    som alternativ till platsknappen i elområdesläget.
  - 1.2.0: Nytt läge "Utan inloggning" (elområde SE1–SE4, manuellt/postnummer/
    plats) via elprisetjustnu.se, som alternativ till Tibber-token.
  - 1.1.0: Möjlighet att välja hem om Tibber-kontot har fler än ett.
  - 1.0.0: Första version enligt kravspecifikationen.

  Versionsnumret visas längst ner i appens inställningsvy, så att man kan
  bekräfta i webbläsaren vilken build som faktiskt körs (t.ex. vid
  cacheproblem efter en uppdatering – gör då en hård omladdning,
  Ctrl/Cmd+Shift+R, eller rensa webbläsarcachen för sidan).
-->
<html lang="sv">
<head>
<meta charset="UTF-8">
<!-- Be webbläsaren att aldrig cacha själva HTML-sidan, så att uppdateringar av
     appen (nya versioner av denna fil) alltid hämtas direkt vid en vanlig
     omladdning, utan att användaren manuellt behöver rensa webbläsarcachen. -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Elpriskoll – din Tibber-elprisindikator</title>
<meta name="description" content="Se om elpriset just nu är bra, mindre bra eller dyrt – och när det blir billigare.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============ Tokens ============ */
:root{
  --accent:#F4B93D;
  --accent-ink:#3A2A05;
  --green:#2FAE66;
  --green-ink:#0E3A22;
  --orange:#E8963C;
  --orange-ink:#4A2A05;
  --red:#E1503F;
  --red-ink:#4A0F09;
  --radius-s:10px;
  --radius-m:16px;
  --radius-l:26px;
  --font-display:'Space Grotesk', ui-sans-serif, system-ui, sans-serif;
  --font-body:'Inter', ui-sans-serif, system-ui, sans-serif;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
}
:root, :root[data-theme="dark"]{
  --bg:#0A0E17;
  --bg-2:#0F1523;
  --surface:#141C2C;
  --surface-2:#1B2437;
  --border:#26314A;
  --text:#ECEEF4;
  --text-dim:#9AA4BC;
  --text-faint:#6B7692;
  --shadow:0 12px 32px -14px rgba(0,0,0,.55);
}
:root[data-theme="light"]{
  --bg:#EEF1EF;
  --bg-2:#F5F7F5;
  --surface:#FFFFFF;
  --surface-2:#F3F5F2;
  --border:#DEE3DE;
  --text:#141810;
  --text-dim:#5C6459;
  --text-faint:#8B9186;
  --shadow:0 12px 28px -16px rgba(20,30,20,.18);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]):not([data-theme="light"]){
    --bg:#EEF1EF; --bg-2:#F5F7F5; --surface:#FFFFFF; --surface-2:#F3F5F2;
    --border:#DEE3DE; --text:#141810; --text-dim:#5C6459; --text-faint:#8B9186;
    --shadow:0 12px 28px -16px rgba(20,30,20,.18);
  }
}
*{box-sizing:border-box;}
html{scroll-padding-top:var(--safe-t); -webkit-text-size-adjust:100%;}
html,body{height:100%;}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  -webkit-font-smoothing:antialiased;
  padding-top:var(--safe-t);
  padding-bottom:var(--safe-b);
  transition:background .25s ease, color .25s ease;
}
h1,h2,h3,.num{font-family:var(--font-display);}
button{font-family:inherit;}
a{color:inherit;}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}
:focus-visible{outline:2.5px solid var(--accent); outline-offset:2px; border-radius:6px;}

/* ============ Shell ============ */
#app{max-width:640px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;}
.topbar{
  position:sticky; top:var(--safe-t); z-index:20;
  display:flex; align-items:center; justify-content:space-between;
  padding:18px 20px 14px;
  background:linear-gradient(var(--bg) 65%, transparent);
}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;letter-spacing:-.01em;}
.brand .bolt{
  width:30px;height:30px;border-radius:9px;
  background:var(--accent); color:var(--accent-ink);
  display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;
}
.icon-btn{
  width:40px;height:40px;border-radius:12px;border:1px solid var(--border);
  background:var(--surface); color:var(--text); display:flex;align-items:center;justify-content:center;
  cursor:pointer; transition:transform .15s ease, background .15s ease;
}
.icon-btn:hover{background:var(--surface-2);}
.icon-btn:active{transform:scale(.94);}
.icon-btn svg{width:19px;height:19px;}
main{flex:1; padding:4px 20px 48px;}
.row-gap{display:flex;gap:10px;}

/* ============ Cards / primitives ============ */
.card{
  background:var(--surface); border:1px solid var(--border);
  border-radius:var(--radius-l); padding:22px; box-shadow:var(--shadow);
}
.section-title{
  font-size:13px; font-weight:600; color:var(--text-dim);
  margin:28px 2px 12px; display:flex; align-items:center; justify-content:space-between;
}
.pill{
  display:inline-flex; align-items:center; gap:6px;
  padding:5px 11px; border-radius:99px; font-size:12.5px; font-weight:600;
  border:1px solid var(--border); background:var(--surface-2); color:var(--text-dim);
}
.btn{
  border-radius:12px; border:1px solid var(--border); background:var(--surface-2);
  color:var(--text); padding:12px 18px; font-weight:600; font-size:14.5px; cursor:pointer;
  transition:transform .15s ease, background .15s ease; text-align:center;
}
.btn:hover{background:var(--border);}
.btn:active{transform:scale(.98);}
.btn-primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink);}
.btn-primary:hover{filter:brightness(1.06);}
.btn-primary:disabled{opacity:.55; cursor:not-allowed;}
.btn-danger{background:transparent; border-color:var(--red); color:var(--red);}
.btn-block{width:100%;}
.field{margin-bottom:18px;}
.field label{display:block; font-size:13.5px; font-weight:600; margin-bottom:7px; color:var(--text-dim);}
.field .hint{font-size:12.5px; color:var(--text-faint); margin-top:6px; line-height:1.5;}
.field .hint a{color:var(--text); font-weight:700; text-decoration:underline; text-decoration-color:var(--accent); text-decoration-thickness:2px; text-underline-offset:2px;}
input[type=text], input[type=password], input[type=number], select{
  width:100%; padding:12px 14px; border-radius:12px; border:1px solid var(--border);
  background:var(--bg-2); color:var(--text); font-size:15px; font-family:inherit;
}
input:focus, select:focus{border-color:var(--accent);}
.error-text{color:var(--red); font-size:13px; font-weight:600; margin-top:8px;}
.toggle-group{display:flex; border:1px solid var(--border); border-radius:12px; overflow:hidden;}
.toggle-group button{
  flex:1; padding:10px; border:none; background:var(--surface); color:var(--text-dim);
  font-weight:600; font-size:13.5px; cursor:pointer; border-right:1px solid var(--border);
}
.toggle-group button:last-child{border-right:none;}
.toggle-group button[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink);}

/* ============ Status colors ============ */
.tone-green{--tone:var(--green); --tone-ink:var(--green-ink);}
.tone-orange{--tone:var(--orange); --tone-ink:var(--orange-ink);}
.tone-red{--tone:var(--red); --tone-ink:var(--red-ink);}
.tone-dot{width:11px;height:11px;border-radius:50%;background:var(--tone); flex-shrink:0;}

/* ============ Hero ============ */
.hero{
  background:linear-gradient(160deg, var(--tone) 0%, color-mix(in srgb, var(--tone) 78%, black 10%) 100%);
  color:var(--tone-ink); border:none; position:relative; overflow:hidden;
}
.hero-top{display:flex; align-items:center; justify-content:space-between; font-size:13.5px; font-weight:600; opacity:.85;}
.hero-price{margin:14px 0 2px; display:flex; align-items:baseline; gap:10px;}
.hero-price .num{font-size:clamp(48px,13vw,64px); font-weight:700; line-height:1; letter-spacing:-.02em;}
.hero-price .unit{font-size:16px; font-weight:600; opacity:.8;}
.hero-msg{font-size:16.5px; font-weight:600; margin-top:6px;}
.hero-sub{font-size:13.5px; margin-top:4px; opacity:.85; font-weight:500;}
.hero-strip{margin-top:20px;}
.hero-strip .track{position:relative; height:10px; border-radius:99px; background:rgba(0,0,0,.16); overflow:visible;}
.hero-strip .seg{position:absolute; top:0; bottom:0; border-radius:99px;}
.hero-strip .marker{
  position:absolute; top:50%; width:16px; height:16px; border-radius:50%;
  background:var(--tone-ink); border:3px solid #fff; transform:translate(-50%,-50%);
  box-shadow:0 2px 6px rgba(0,0,0,.3);
}
.hero-strip .labels{display:flex; justify-content:space-between; font-size:11px; font-weight:600; opacity:.75; margin-top:7px;}
.hero-icon{position:absolute; right:18px; top:18px; font-size:26px; opacity:.9;}

/* ============ Next cheap ============ */
.next-card{display:flex; align-items:center; gap:14px;}
.next-card .glyph{
  width:46px;height:46px;border-radius:13px; background:var(--surface-2); color:var(--green);
  display:flex;align-items:center;justify-content:center; flex-shrink:0; font-size:20px;
}
.next-card .body{flex:1; min-width:0;}
.next-card .title{font-weight:700; font-size:15.5px;}
.next-card .desc{font-size:13.5px; color:var(--text-dim); margin-top:2px;}

/* ============ Meta row ============ */
.meta-row{display:flex; align-items:center; justify-content:space-between; margin-top:14px; padding:0 2px;}
.meta-row .updated{font-size:12.5px; color:var(--text-faint);}
.refresh-btn{display:flex; align-items:center; gap:6px; background:none; border:none; color:var(--text-dim); font-size:12.5px; font-weight:600; cursor:pointer; padding:4px;}
.refresh-btn svg{width:14px;height:14px;}
.refresh-btn.spin svg{animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* ============ Chart / overview ============ */
.chart-wrap{overflow-x:auto; padding-bottom:4px; margin:0 -22px; padding-left:22px; padding-right:22px;}
.chart-wrap::-webkit-scrollbar{height:5px;}
.chart-svg{display:block;}
.bar{cursor:default;}
.bar.current rect.fill{stroke:var(--text); stroke-width:2;}
.legend{display:flex; gap:16px; margin-top:14px; flex-wrap:wrap;}
.legend .item{display:flex; align-items:center; gap:6px; font-size:12px; color:var(--text-dim); font-weight:600;}
.legend .sw{width:9px;height:9px;border-radius:3px;}
.period-list{margin-top:16px; display:flex; flex-direction:column; gap:2px;}
.period-row{display:flex; align-items:center; gap:12px; padding:10px 4px; border-bottom:1px solid var(--border); font-size:13.5px;}
.period-row:last-child{border-bottom:none;}
.period-row .time{width:52px; color:var(--text-dim); font-variant-numeric:tabular-nums; flex-shrink:0;}
.period-row .price{font-weight:700; font-variant-numeric:tabular-nums; width:70px; flex-shrink:0;}
.period-row .flag{margin-left:auto; font-size:11.5px; font-weight:600; color:var(--text-faint);}
.period-row.current{background:var(--surface-2); border-radius:10px;}

/* ============ Banner ============ */
.banner{
  display:flex; gap:12px; align-items:flex-start; padding:14px 16px; border-radius:14px;
  background:color-mix(in srgb, var(--orange) 16%, var(--surface)); border:1px solid color-mix(in srgb, var(--orange) 40%, var(--border));
  font-size:13.5px; margin-bottom:18px;
}
.banner.error{background:color-mix(in srgb, var(--red) 14%, var(--surface)); border-color:color-mix(in srgb, var(--red) 40%, var(--border));}
.banner .txt{flex:1; line-height:1.5;}
.banner .txt strong{display:block; margin-bottom:2px;}
.banner button{flex-shrink:0;}

/* ============ Connect screen ============ */
.connect-wrap{padding-top:8vh; display:flex; flex-direction:column; align-items:center; text-align:center;}
.connect-wrap .bolt-big{
  width:64px;height:64px;border-radius:18px; background:var(--accent); color:var(--accent-ink);
  display:flex;align-items:center;justify-content:center;font-size:30px; margin-bottom:22px;
}
.connect-wrap h1{font-size:26px; margin:0 0 8px; letter-spacing:-.01em;}
.connect-wrap p.lead{color:var(--text-dim); font-size:15px; line-height:1.6; max-width:360px; margin:0 0 30px;}
.connect-form{width:100%; max-width:380px; text-align:left;}
.trust-note{display:flex; gap:10px; align-items:flex-start; background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:14px; font-size:12.5px; color:var(--text-dim); line-height:1.55; margin-top:18px;}
.trust-note svg{width:17px;height:17px;flex-shrink:0; margin-top:1px; color:var(--accent);}

/* ============ Settings ============ */
.settings-group{margin-bottom:6px;}
.settings-group .card{margin-bottom:16px;}
.level-row{display:flex; align-items:center; gap:12px; margin-bottom:14px;}
.level-row .sw{width:14px;height:14px;border-radius:5px; flex-shrink:0;}
.level-row input[type=number]{width:88px; text-align:right;}
.level-row .lbl{flex:1; font-weight:600; font-size:14px;}
.level-row .to{color:var(--text-faint); font-size:13px;}
.token-status{display:flex; align-items:center; justify-content:space-between; gap:12px;}
.token-status .lbl{font-size:13px; color:var(--text-dim);}
.token-status .val{font-weight:700; font-family:var(--font-display); letter-spacing:.02em;}
.tabbar{display:flex; gap:8px; margin-bottom:6px;}
footer.legal{padding:10px 20px 40px; text-align:center; font-size:11.5px; color:var(--text-faint); line-height:1.6;}
</style>
</head>
<body>
<div id="app" role="application" aria-label="Elpriskoll"></div>
<div aria-live="polite" class="visually-hidden" id="live-region"></div>

<script>
"use strict";

/* =========================================================================
   Elpriskoll – Tibber elprisindikator
   Fristående statisk webbapp (inga byggverktyg krävs), byggd för GitHub Pages.
   All data hämtas direkt i webbläsaren från Tibbers GraphQL-API.
   Ingen token eller autentiseringsuppgift lagras i källkoden.
   ========================================================================= */

const APP_VERSION = "1.6.0";
const APP_BUILD_DATE = "2026-09-22";

const TIBBER_ENDPOINT = "https://api.tibber.com/v1-beta/gql";
const ZONE_API_BASE = "https://www.elprisetjustnu.se/api/v1/prices";
const LS_TOKEN = "elpriskoll.token.v1";
const LS_ZONE = "elpriskoll.zone.v1";
const LS_SETTINGS = "elpriskoll.settings.v1";
const LS_CACHE = "elpriskoll.cache.v1";
const LS_ONBOARD_DISMISSED = "elpriskoll.onboard-dismissed.v1";

const ELOMRADEN = [
  {id:"SE1", name:"Norra Sverige", hint:"t.ex. Luleå, Kiruna"},
  {id:"SE2", name:"Norra Mellansverige", hint:"t.ex. Sundsvall, Östersund"},
  {id:"SE3", name:"Södra Mellansverige", hint:"t.ex. Stockholm, Göteborg"},
  {id:"SE4", name:"Södra Sverige", hint:"t.ex. Malmö, Karlskrona"}
];
function zoneLabel(id){
  const z = ELOMRADEN.find(z => z.id === id);
  return z ? z.id + " – " + z.name : id;
}

const DEFAULT_SETTINGS = {
  greenMax: 100,      // öre/kWh, övre gräns för grönt
  orangeMax: 200,      // öre/kWh, övre gräns för orange (över detta = rött)
  msgGreen: "Bra pris just nu!",
  msgOrange: "Håll igen, inte optimalt.",
  msgRed: "Långt ifrån optimalt, ladda absolut inte bilen.",
  unit: "ore",          // "ore" | "kr"
  refreshMinutes: 5,
  theme: "system",      // "system" | "light" | "dark"
  homeId: null
};

/* ---------------------------- State ---------------------------- */
const state = {
  view: "loading",           // loading | connect | home | settings
  mode: null,                 // "tibber" | "zone" | null
  connectTab: "tibber",       // which tab is active on the connect screen
  token: null,
  zone: null,
  geoLoading: false,
  settings: loadSettings(),
  data: null,                // { homes:[...], homeId, current, today:[], tomorrow:[] }
  lastUpdated: null,
  loading: false,
  error: null,                // {message} shown as banner, data may still be cached
  connectError: null,
  refreshTimer: null,
  activeDay: "today",         // today | tomorrow
  settingsDraft: null,
  settingsError: null,
  refreshing: false,
  onboardDismissed: false
};

/* ---------------------------- Utilities ---------------------------- */
function loadSettings(){
  try{
    const raw = localStorage.getItem(LS_SETTINGS);
    if(!raw) return {...DEFAULT_SETTINGS};
    return {...DEFAULT_SETTINGS, ...JSON.parse(raw)};
  }catch(e){ return {...DEFAULT_SETTINGS}; }
}
function saveSettings(s){
  state.settings = s;
  localStorage.setItem(LS_SETTINGS, JSON.stringify(s));
}
function loadToken(){
  try{ return localStorage.getItem(LS_TOKEN) || null; }catch(e){ return null; }
}
function saveToken(t){
  localStorage.setItem(LS_TOKEN, t);
}
function clearToken(){
  localStorage.removeItem(LS_TOKEN);
}
function loadZone(){
  try{ return localStorage.getItem(LS_ZONE) || null; }catch(e){ return null; }
}
function saveZone(z){
  localStorage.setItem(LS_ZONE, z);
}
function clearZone(){
  localStorage.removeItem(LS_ZONE);
}
function loadCache(){
  try{
    const raw = localStorage.getItem(LS_CACHE);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}
function saveCache(data, ts){
  try{ localStorage.setItem(LS_CACHE, JSON.stringify({data, ts})); }catch(e){}
}
function maskToken(t){
  if(!t) return "";
  if(t.length <= 8) return "•".repeat(t.length);
  return t.slice(0,4) + " •••• " + t.slice(-4);
}
function oreFromTotal(total){ return Math.round(total * 100); }
function formatPrice(total, unit){
  if(unit === "kr") return total.toFixed(2).replace(".", ",") + " kr/kWh";
  return Math.round(total*100) + " öre/kWh";
}
function formatPriceCompact(total, unit){
  if(unit === "kr") return total.toFixed(2).replace(".", ",");
  return String(Math.round(total*100));
}
function classify(total, settings){
  const ore = oreFromTotal(total);
  if(ore <= settings.greenMax) return "green";
  if(ore <= settings.orangeMax) return "orange";
  return "red";
}
function toneLabel(tone){
  return tone === "green" ? "Bra" : tone === "orange" ? "Mindre bra" : "Dyrt";
}
function toneMessage(tone, settings){
  return tone === "green" ? settings.msgGreen : tone === "orange" ? settings.msgOrange : settings.msgRed;
}
function toneIcon(tone){
  return tone === "green" ? "🟢" : tone === "orange" ? "🟠" : "🔴";
}
function fmtTime(iso){
  const d = new Date(iso);
  return d.toLocaleTimeString("sv-SE", {hour:"2-digit", minute:"2-digit"});
}
function fmtClock(d){
  return d.toLocaleTimeString("sv-SE", {hour:"2-digit", minute:"2-digit"});
}
function announce(msg){
  const r = document.getElementById("live-region");
  if(r) r.textContent = msg;
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

/* ---------------------------- GraphQL ---------------------------- */
async function gql(token, query, variables, timeoutMs){
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), timeoutMs || 12000);
  let res;
  try{
    res = await fetch(TIBBER_ENDPOINT, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + token
      },
      body: JSON.stringify({query, variables: variables || {}}),
      signal: ctrl.signal
    });
  }catch(networkErr){
    clearTimeout(timer);
    if(networkErr.name === "AbortError"){
      throw {kind:"timeout", message:"Anslutningen till Tibber tog för lång tid. Kontrollera din internetanslutning."};
    }
    throw {kind:"network", message:"Kunde inte nå Tibbers server. Kontrollera din internetanslutning och försök igen."};
  }
  clearTimeout(timer);

  if(res.status === 401 || res.status === 403){
    throw {kind:"auth", message:"Kunde inte ansluta till Tibber. Kontrollera din API-token."};
  }
  if(!res.ok){
    throw {kind:"http", message:"Tibbers server svarade med ett fel (" + res.status + "). Försök igen om en liten stund."};
  }
  let json;
  try{ json = await res.json(); }
  catch(e){ throw {kind:"parse", message:"Kunde inte tolka svaret från Tibber."}; }

  if(json.errors && json.errors.length){
    const msg = json.errors[0].message || "";
    if(/token|unauthoriz|auth/i.test(msg)){
      throw {kind:"auth", message:"Kunde inte ansluta till Tibber. Kontrollera din API-token."};
    }
    throw {kind:"graphql", message:"Tibber rapporterade ett fel: " + msg};
  }
  return json.data;
}

const VALIDATE_QUERY = `query { viewer { login name } }`;

const PRICES_QUERY = `
query {
  viewer {
    homes {
      id
      appNickname
      address { address1 }
      currentSubscription {
        priceInfo {
          current { total energy tax startsAt level }
          today { total energy tax startsAt level }
          tomorrow { total energy tax startsAt level }
        }
      }
    }
  }
}`;

async function validateToken(token){
  const data = await gql(token, VALIDATE_QUERY, {}, 10000);
  if(!data || !data.viewer) throw {kind:"auth", message:"Kunde inte ansluta till Tibber. Kontrollera din API-token."};
  return data.viewer;
}

async function fetchPrices(token){
  const data = await gql(token, PRICES_QUERY, {}, 15000);
  const homes = (data && data.viewer && data.viewer.homes) || [];
  if(!homes.length){
    throw {kind:"nohomes", message:"Inget hem hittades på ditt Tibber-konto."};
  }
  return homes;
}

/* ---------------------------- Elområde (utan Tibber-inloggning) ----------------------------
   Källa: elprisetjustnu.se – ett öppet, kostnadsfritt API för Nord Pool-spotpriser per
   svenskt elområde. Ingen inloggning krävs. Priset är detsamma för alla i samma elområde
   och motsvarar därför INTE nödvändigtvis exakt vad en enskild Tibber-kund betalar (t.ex.
   om kontot har fastpris eller ett annat påslag än ren spotprisvidarefakturering).
   API:t levererar rent spotpris exklusive skatt och moms. För att bli jämförbart med
   Tibbers "total" (energi + skatt, inkl. moms) lägger vi på svensk energiskatt på el och
   räknar sedan upp hela summan med 25% moms – precis som på en vanlig elräkning. */
const ELSKATT_ORE = 36.0; // öre/kWh exkl. moms, 2026 års standardnivå (Skatteverket/Ekonomifakta).
                            // Hushåll i vissa kommuner i norra Sverige har ca 9,6 öre lägre skatt –
                            // det tas inte hänsyn till här, vilket gör uppskattningen något hög där.
function zoneFromCoords(lat){
  // Grov approximation baserad på breddgrad. Elområdenas riktiga gränser följer läns-
  // gränser (inte räta linjer), så detta är en uppskattning – inte en exakt uppslagning.
  if(lat >= 63.8) return "SE1";
  if(lat >= 61.0) return "SE2";
  if(lat >= 58.2) return "SE3";
  return "SE4";
}

// Grov uppslagning postnummerprefix (tre första siffrorna) -> elområde, baserad på
// PostNords postorter per postnummerintervall. Länsgränser (och därmed elområdes-
// gränser) följer inte postnummerintervallen exakt, så detta är en uppskattning –
// inte en officiell källa. Användaren kan alltid välja elområde manuellt istället.
const POSTNUMMER_ZONER = [
  {max: 199, zone: "SE3"}, // Stockholm m.fl.
  {max: 297, zone: "SE4"}, // Malmö, Helsingborg, Ystad, Hässleholm, Kristianstad
  {max: 398, zone: "SE4"}, // Halmstad, Växjö, Karlskrona, Kalmar
  {max: 475, zone: "SE3"}, // Göteborg m.fl.
  {max: 549, zone: "SE3"}, // Borås, Skövde, Mariestad
  {max: 589, zone: "SE3"}, // Jönköping, Linköping
  {max: 659, zone: "SE3"}, // Norrköping, Nyköping, Strängnäs, Karlstad
  {max: 780, zone: "SE3"}, // Örebro, Västerås, Uppsala m.fl.
  {max: 829, zone: "SE2"}, // Borlänge, Falun, Gävle
  {max: 899, zone: "SE2"}, // Östersund, Sundsvall
  {max: 999, zone: "SE1"}  // Umeå, Luleå, övre Norrland
];
function zoneFromPostnummer(input){
  const digits = String(input || "").replace(/\D/g, "");
  if(digits.length < 3) return null;
  const prefix = parseInt(digits.slice(0, 3), 10);
  for(const r of POSTNUMMER_ZONER){
    if(prefix <= r.max) return r.zone;
  }
  return null;
}
async function fetchZoneDay(zone, date){
  const y = date.getFullYear();
  const m = String(date.getMonth()+1).padStart(2,"0");
  const d = String(date.getDate()).padStart(2,"0");
  const url = `${ZONE_API_BASE}/${y}/${m}-${d}_${zone}.json`;
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 12000);
  let res;
  try{
    res = await fetch(url, {signal: ctrl.signal});
  }catch(networkErr){
    clearTimeout(timer);
    if(networkErr.name === "AbortError"){
      throw {kind:"timeout", message:"Anslutningen till elprisetjustnu.se tog för lång tid."};
    }
    throw {kind:"network", message:"Kunde inte nå elprisetjustnu.se. Kontrollera din internetanslutning."};
  }
  clearTimeout(timer);
  if(res.status === 404){
    throw {kind:"notfound", message:"Priser för den här dagen är inte publicerade än."};
  }
  if(!res.ok){
    throw {kind:"http", message:"Kunde inte hämta priser (fel " + res.status + "). Försök igen om en liten stund."};
  }
  let arr;
  try{ arr = await res.json(); }
  catch(e){ throw {kind:"parse", message:"Kunde inte tolka svaret från elprisetjustnu.se."}; }
  return arr.map(p => ({
    total: (p.SEK_per_kWh + ELSKATT_ORE / 100) * 1.25,
    startsAt: p.time_start,
    endsAt: p.time_end
  }));
}
// Räknar fram vilken period som pågår just nu utifrån en lista av prisperioder,
// oavsett om de är i tim- eller kvartsupplösning. Används för BÅDA Tibber- och
// elområdesläget, så att "just nu"-rutan alltid räknas fram på exakt samma sätt
// och alltid matchar den upplösning som periods-listan faktiskt har – istället
// för att i Tibber-läget lita på fältet Tibber själva kallar "current", som kan
// skilja sig i tidsupplösning från today-listan.
function computeCurrentPeriod(periods, now){
  if(!periods || !periods.length) return null;
  const nowMs = now.getTime();
  const past = periods.filter(p => new Date(p.startsAt).getTime() <= nowMs);
  return past.length ? past[past.length - 1] : periods[0];
}

async function fetchZonePrices(zone){
  const now = new Date();
  const today = await fetchZoneDay(zone, now);
  let tomorrow = [];
  try{
    const t = new Date(now);
    t.setDate(t.getDate() + 1);
    tomorrow = await fetchZoneDay(zone, t);
  }catch(e){
    tomorrow = []; // inte publicerat än – hanteras som "imorgondagens priser saknas"
  }
  return {today, tomorrow, current: computeCurrentPeriod(today, now)};
}

/* ---------------------------- Data helpers ---------------------------- */
function pickHome(homes, homeId){
  if(homeId){
    const found = homes.find(h => h.id === homeId);
    if(found) return found;
  }
  return homes[0];
}
function extractPriceInfo(home){
  const pi = home && home.currentSubscription && home.currentSubscription.priceInfo;
  const today = (pi && pi.today) || [];
  const tomorrow = (pi && pi.tomorrow) || [];
  // Använder Tibbers EGET "current"-fält som förstahandsval – det är den siffra
  // Tibber själva anser är aktuellt pris just nu, och garanterar därför att
  // "just nu"-rutan här matchar Tibber-appen exakt. Tidsupplösningen (tim eller
  // kvart) följer i så fall vad Tibber faktiskt levererar för just det här hemmet
  // – appen kan inte visa finare upplösning än vad Tibber själva har tillgång
  // till. Beräknas bara fram lokalt (computeCurrentPeriod) om Tibber undantagsvis
  // inte skulle skicka med ett current-fält alls.
  const current = (pi && pi.current) || computeCurrentPeriod(today, new Date());
  return { current, today, tomorrow };
}
function findNextCheap(today, tomorrow, settings, now){
  const combined = today.concat(tomorrow);
  const future = combined.filter(p => new Date(p.startsAt).getTime() > now.getTime());
  for(const p of future){
    if(classify(p.total, settings) === "green") return p;
  }
  return null;
}
function periodsFromNow(periods, current){
  // Visar dagens prisöversikt från och med den period som pågår just nu, istället
  // för att alltid börja om vid midnatt – redan passerade perioder idag döljs.
  if(!periods || !periods.length || !current) return periods;
  const idx = periods.findIndex(p => p.startsAt === current.startsAt);
  return idx === -1 ? periods : periods.slice(idx);
}
function findExtremes(list){
  if(!list.length) return {min:null, max:null};
  let min = list[0], max = list[0];
  for(const p of list){
    if(p.total < min.total) min = p;
    if(p.total > max.total) max = p;
  }
  return {min, max};
}
function currentPeriodKey(period){
  return period ? period.startsAt : null;
}

/* ---------------------------- Load flow ---------------------------- */
async function boot(){
  applyTheme();
  state.token = loadToken();
  state.zone = loadZone();
  try{ state.onboardDismissed = localStorage.getItem(LS_ONBOARD_DISMISSED) === "1"; }catch(e){}
  const cached = loadCache();
  if(cached){
    state.data = cached.data;
    state.lastUpdated = cached.ts ? new Date(cached.ts) : null;
  }
  if(state.token){
    state.mode = "tibber";
  }else if(state.zone){
    state.mode = "zone";
  }else{
    state.view = "connect";
    render();
    return;
  }
  state.view = "home";
  render();
  await refreshPrices(true);
  scheduleAutoRefresh();
}

function scheduleAutoRefresh(){
  if(state.refreshTimer) clearInterval(state.refreshTimer);
  const ms = Math.max(1, state.settings.refreshMinutes) * 60 * 1000;
  state.refreshTimer = setInterval(() => refreshPrices(false), ms);
}

async function refreshPrices(isInitial){
  if(state.mode === "tibber" && !state.token) return;
  if(state.mode === "zone" && !state.zone) return;
  if(!state.mode) return;
  state.refreshing = true;
  if(!isInitial) render();
  try{
    let payload;
    if(state.mode === "tibber"){
      const homes = await fetchPrices(state.token);
      const home = pickHome(homes, state.settings.homeId);
      const info = extractPriceInfo(home);
      payload = {
        homes: homes.map(h => ({id:h.id, name:h.appNickname || (h.address && h.address.address1) || "Hem"})),
        homeId: home.id,
        current: info.current,
        today: info.today,
        tomorrow: info.tomorrow
      };
    }else{
      const z = await fetchZonePrices(state.zone);
      payload = {
        homes: [{id: state.zone, name: zoneLabel(state.zone)}],
        homeId: state.zone,
        current: z.current,
        today: z.today,
        tomorrow: z.tomorrow
      };
    }
    state.data = payload;
    state.lastUpdated = new Date();
    state.error = null;
    saveCache(payload, state.lastUpdated.getTime());
    announce("Elpriset har uppdaterats.");
  }catch(err){
    const message = (err && err.message) || "Kunde inte hämta elpriset just nu.";
    state.error = {message, kind: err && err.kind};
    announce(message);
  }finally{
    state.refreshing = false;
    render();
  }
}

/* ---------------------------- Actions ---------------------------- */
async function handleConnect(token){
  state.connectError = null;
  state.loading = true;
  render();
  try{
    await validateToken(token);
    saveToken(token);
    state.token = token;
    state.mode = "tibber";
    state.view = "home";
    state.loading = false;
    render();
    await refreshPrices(true);
    scheduleAutoRefresh();
  }catch(err){
    state.loading = false;
    state.connectError = (err && err.message) || "Kunde inte ansluta till Tibber. Kontrollera din API-token.";
    render();
  }
}

async function handleConnectZone(zone){
  state.connectError = null;
  state.loading = true;
  render();
  try{
    await fetchZoneDay(zone, new Date()); // bekräfta att elområdet ger giltig data
    saveZone(zone);
    state.zone = zone;
    state.mode = "zone";
    state.view = "home";
    state.loading = false;
    render();
    await refreshPrices(true);
    scheduleAutoRefresh();
  }catch(err){
    state.loading = false;
    state.connectError = (err && err.message) || "Kunde inte hämta priser för det valda elområdet.";
    render();
  }
}

function useMyLocation(){
  if(!navigator.geolocation){
    state.connectError = "Din webbläsare stöder inte platsdelning. Välj elområde manuellt istället.";
    render();
    return;
  }
  state.geoLoading = true;
  state.connectError = null;
  render();
  navigator.geolocation.getCurrentPosition(
    (pos) => {
      const zone = zoneFromCoords(pos.coords.latitude);
      state.geoLoading = false;
      handleConnectZone(zone);
    },
    () => {
      state.geoLoading = false;
      state.connectError = "Kunde inte hämta din plats. Välj elområde manuellt istället.";
      render();
    },
    {timeout: 10000}
  );
}

function handleDisconnect(){
  clearToken();
  clearZone();
  localStorage.removeItem(LS_CACHE);
  state.token = null;
  state.zone = null;
  state.mode = null;
  state.data = null;
  state.lastUpdated = null;
  state.error = null;
  if(state.refreshTimer) clearInterval(state.refreshTimer);
  state.view = "connect";
  render();
  announce("Du har kopplat från.");
}

function openSettings(){
  state.settingsDraft = {...state.settings};
  state.settingsError = null;
  state.view = "settings";
  render();
}
function closeSettings(){
  state.view = "home";
  render();
}
// Sparar utkastet direkt (autosave) så länge det är giltigt. Körs vid varje
// ändring i inställningarna – ingen separat "Spara"-knapp krävs längre.
// Returnerar true om det sparades, false om det just nu är ogiltigt (t.ex.
// grön gräns >= orange gräns) – då visas ett felmeddelande men det senast
// giltiga sparade värdet ligger kvar orört tills fältet rättas till.
function commitSettingsDraft(){
  const d = state.settingsDraft;
  if(!(d.greenMax > 0) || !(d.orangeMax > 0)){
    state.settingsError = "Gränsvärdena måste vara positiva tal.";
    return false;
  }
  if(d.greenMax >= d.orangeMax){
    state.settingsError = "Den gröna gränsen måste vara lägre än den orange gränsen.";
    return false;
  }
  const homeChanged = d.homeId && state.data && d.homeId !== state.data.homeId;
  saveSettings({...d});
  applyTheme();
  scheduleAutoRefresh();
  state.settingsError = null;
  if(homeChanged) refreshPrices(false);
  return true;
}
function resetSettingsDraft(){
  state.settingsDraft = {
    ...DEFAULT_SETTINGS,
    theme: state.settingsDraft.theme,
    unit: state.settingsDraft.unit,
    homeId: state.settingsDraft.homeId
  };
  state.settingsError = null;
  commitSettingsDraft();
}
function resetEverything(){
  const msg = "Vill du nollställa allt? Detta raderar din sparade token/elområde, alla inställningar och senast hämtade priser från den här webbläsaren, och startar om appen helt. Går inte att ångra.";
  if(!confirm(msg)) return;
  try{
    localStorage.removeItem(LS_TOKEN);
    localStorage.removeItem(LS_ZONE);
    localStorage.removeItem(LS_SETTINGS);
    localStorage.removeItem(LS_CACHE);
    localStorage.removeItem(LS_ONBOARD_DISMISSED);
  }catch(e){}
  if(state.refreshTimer) clearInterval(state.refreshTimer);
  // Ladda om sidan från grunden (inte bara appens state), så eventuell
  // kvarvarande minnestillstånd i fliken också nollställs helt.
  location.href = location.pathname + location.search;
  location.reload();
}

/* ============================================================
   Rendering
   ============================================================ */
function render(){
  const app = document.getElementById("app");
  if(state.view === "loading"){
    app.innerHTML = renderLoadingShell();
  }else if(state.view === "connect"){
    app.innerHTML = renderConnect();
    wireConnect();
  }else if(state.view === "settings"){
    app.innerHTML = renderTopbar("Inställningar", true) + renderSettings();
    wireTopbar();
    wireSettings();

    wireTopbar();
    wireHome();

}

// Tibbers "current"-objekt har ingen egen sluttid, så vi hittar den genom att
// leta upp nästa period i today/tomorrow-listan. Ger t.ex. "14:00–14:15" vid
// kvartsupplösning eller "14:00–15:00" vid timupplösning, så det syns tydligt
// vilken tidsupplösning Tibber faktiskt levererar för det här hemmet.
function findPeriodEnd(current, today, tomorrow){
  if(!current) return null;
  const combined = (today || []).concat(tomorrow || []);
  const idx = combined.findIndex(p => p.startsAt === current.startsAt);
  if(idx === -1 || idx === combined.length - 1) return null;
  return combined[idx + 1].startsAt;
}
function tonePosition(total, settings){
  const ore = oreFromTotal(total);
  const g = settings.greenMax, o = settings.orangeMax;
  if(ore <= g){
    return clamp((ore / Math.max(g,1)) * 33.3, 1, 33);
  }else if(ore <= o){
    return 33.3 + clamp(((ore - g) / Math.max(o - g, 1)) * 33.3, 0, 33.3);
  }else{
    const span = Math.max(o * 0.6, 40);
    return 66.6 + clamp(((ore - o) / span) * 33.4, 0, 33.4);
  }
}
function clamp(v, min, max){ return Math.max(min, Math.min(max, v)); }

function renderNextCheapCard(currentTone, next, hasTomorrow, settings){

    return `<div class="card next-card" style="margin-top:14px;">

}

function periodResolutionLabel(periods){
  if(!periods || periods.length < 2) return "";
  const mins = Math.round((new Date(periods[1].startsAt) - new Date(periods[0].startsAt)) / 60000);
  if(mins > 0 && mins <= 20) return "15 min-upplösning";
  if(mins > 20 && mins <= 40) return "30 min-upplösning";
  return "Timupplösning";
}

function renderChartAndList(periods, settings, current){
  if(!periods || !periods.length){
    return `<div style="text-align:center;color:var(--text-dim);padding:20px 0;">Ingen prisdata tillgänglig för den här dagen.</div>`;
  }
  const {min, max} = findExtremes(periods);
  const domainMax = Math.max(...periods.map(p => oreFromTotal(p.total)), settings.orangeMax * 1.15);
  // chartH = ren stapelyta (0 = topp, chartH = baslinje). valueTop = extra utrymme
  // ovanför staplarna där prissiffran skrivs ut, så den inte klipps även för de
  // högsta staplarna. Allt ritas i en grupp som förskjuts neråt med valueTop.
  const chartH = 130, labelH = 26, valueTop = 16, barW = 22, gap = 6, padTop = 6;
  const w = periods.length * (barW + gap) + 20;
  const totalH = valueTop + chartH + labelH + 4;

  const bars = periods.map((p, i) => {
    const tone = classify(p.total, settings);
    const ore = oreFromTotal(p.total);
    const h = Math.max(4, (ore / domainMax) * (chartH - padTop));
    const x = i * (barW + gap);
    const y = chartH - h;
    const isCurrent = current && p.startsAt === current.startsAt;
    return `<g class="bar ${isCurrent ? "current" : ""}">
      <rect class="fill" x="${x}" y="${y}" width="${barW}" height="${h}" rx="5" fill="var(--${tone})"></rect>
      <text x="${x + barW/2}" y="${y - 5}" font-size="9.5" font-weight="700" fill="var(--text-dim)" text-anchor="middle" font-family="var(--font-body)">${formatPriceCompact(p.total, settings.unit)}</text>
    </g>`;
  }).join("");

  // Klockslagsetiketter: en etikett per hela timme (t.ex. var 4:e stapel vid 15 min-
  // upplösning), så grafen alltid visar rätt klockslag oavsett om Tibber/elområdet
  // levererar tim- eller kvartsprisperioder.
  const labels = periods.map((p, i) => {
    const d = new Date(p.startsAt);
    if(d.getMinutes() !== 0) return "";
    const x = i * (barW + gap) + barW / 2;
    const y = chartH + 15;
    return `<text x="0" y="0" transform="translate(${x} ${y}) rotate(-50)" font-size="10" fill="var(--text-faint)" text-anchor="end" font-family="var(--font-body)">${fmtTime(p.startsAt)}</text>`;
  }).join("");

  const greenY = chartH - (settings.greenMax / domainMax) * (chartH - padTop);
  const orangeY = chartH - (settings.orangeMax / domainMax) * (chartH - padTop);

  const svg = `
  <div class="row-gap" style="justify-content:space-between; align-items:center; margin-bottom:8px;">
    <span class="pill" style="font-weight:600;">${periodResolutionLabel(periods)}</span>
    <span style="font-size:12px; color:var(--text-faint); font-weight:600;">${settings.unit === "kr" ? "kr/kWh" : "öre/kWh"}</span>
  </div>
  <div class="chart-wrap">
    <svg class="chart-svg" width="${w}" height="${totalH}" viewBox="0 0 ${w} ${totalH}" role="img" aria-label="Diagram över prisperioder med klockslag och pris">
      <g transform="translate(0, ${valueTop})">
        <line x1="0" y1="${greenY}" x2="${w}" y2="${greenY}" stroke="var(--green)" stroke-dasharray="3 4" stroke-width="1.5" opacity=".7"></line>
        <line x1="0" y1="${orangeY}" x2="${w}" y2="${orangeY}" stroke="var(--orange)" stroke-dasharray="3 4" stroke-width="1.5" opacity=".7"></line>
        ${bars}
        ${labels}
      </g>
    </svg>
  </div>
  <div class="legend">
    <span class="item"><span class="sw" style="background:var(--green);"></span>Bra ≤ ${settings.greenMax} öre</span>
    <span class="item"><span class="sw" style="background:var(--orange);"></span>Mindre bra ≤ ${settings.orangeMax} öre</span>
    <span class="item"><span class="sw" style="background:var(--red);"></span>Dyrt &gt; ${settings.orangeMax} öre</span>
  </div>`;

  const rows = periods.map(p => {
    const tone = classify(p.total, settings);
    const isCurrent = current && p.startsAt === current.startsAt;
    const isMin = min && p.startsAt === min.startsAt;
    const isMax = max && p.startsAt === max.startsAt;
    let flag = "";
    if(isMin) flag = "Billigast";
    else if(isMax) flag = "Dyrast";
    return `<div class="period-row ${isCurrent ? "current" : ""}">
      <span class="tone-dot" style="background:var(--${tone});"></span>
      <span class="time">${fmtTime(p.startsAt)}</span>
      <span class="price">${formatPrice(p.total, settings.unit)}</span>
      ${flag ? `<span class="flag">${flag}</span>` : ""}
      ${isCurrent ? `<span class="flag" style="color:var(--text-dim);">Nu</span>` : ""}
    </div>`;
  }).join("");

  return svg + `<div class="period-list">${rows}</div>`;
}

function wireSettings(){
  const d = state.settingsDraft;

      : "Vill du koppla från ditt Tibber-konto? Din sparade token tas bort från den här webbläsaren.";
    if(confirm(msg)){
      handleDisconnect();
    }
  });
  const homeSel = document.getElementById("home-select");
  if(homeSel) homeSel.addEventListener("change", (e) => { d.homeId = e.target.value; });

  document.querySelectorAll("[data-unit]").forEach(btn => {
    btn.addEventListener("click", () => { d.unit = btn.getAttribute("data-unit"); commitSettingsDraft(); render_settings_inplace(); });
  });
  document.querySelectorAll("[data-theme]").forEach(btn => {
    btn.addEventListener("click", () => { d.theme = btn.getAttribute("data-theme"); commitSettingsDraft(); render_settings_inplace(); });
  });
  ["greenMax","orangeMax"].forEach(id => {
    // "change" (inte "input") så fältet inte tappar fokus mitt i skrivandet –
    // sparas ändå automatiskt så fort man lämnar fältet eller trycker Enter.
    document.getElementById(id).addEventListener("change", (e) => {
      d[id] = parseInt(e.target.value, 10) || 0;
      commitSettingsDraft();
      render_settings_inplace();
    });
  });
  ["msgGreen","msgOrange","msgRed"].forEach(id => {
    document.getElementById(id).addEventListener("input", (e) => {
      d[id] = e.target.value;
      commitSettingsDraft();
    });
  });
  document.getElementById("refreshMinutes").addEventListener("change", (e) => {
    d.refreshMinutes = parseInt(e.target.value, 10);
    commitSettingsDraft();
  });
  document.getElementById("btn-reset-defaults").addEventListener("click", () => { resetSettingsDraft(); render_settings_inplace(); });
  document.getElementById("btn-done").addEventListener("click", () => { commitSettingsDraft(); closeSettings(); });
  document.getElementById("btn-reset-everything").addEventListener("click", resetEverything);

  function render_settings_inplace(){
    // Re-render settings view only, preserving draft object reference.
    const app = document.getElementById("app");
    app.innerHTML = renderTopbar("Inställningar", true) + renderSettings();
    wireTopbar();
    wireSettings();
  }
}
